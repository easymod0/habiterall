# Builds the native Android client.
#
#   - PULL REQUEST — unit tests, lint and a debug APK. Never publishes.
#   - PUSH TO MAIN — the same, then a release APK attached to a GitHub
#     release, so merging is what ships.
#   - MANUAL — build a release on demand.
#
# Only runs when something that can actually affect the client changes: its
# own sources, this workflow, or the two shared files whose contract it
# hard-codes.
#
# Signing is optional. Without the secrets the release build still succeeds and
# produces an unsigned APK, which is enough for sideloading via `adb install`.

name: Android (native)

on:
  # A `paths` filter applies to TAG pushes too, and a tag changes no files —
  # so a block pairing `tags:` with `paths:` matches nothing at all. Releases
  # are therefore driven by a push to main rather than by tagging, which also
  # matches how the rest of this repo publishes.
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
      # The Kotlin client hard-codes the REST contract — field names, the
      # x1000 entry scaling, the sentinel values — so a change to either of
      # these can break it even though no Kotlin file moved.
      - 'shared/src/types.js'
      - 'shared/src/constants.js'
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
      - 'shared/src/types.js'
      - 'shared/src/constants.js'
  workflow_dispatch:

# Read-only by default; only the release job needs to publish, and it asks
# for write itself. The build job runs on every fork PR and must not carry
# write scope it never uses.
permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The repo does not commit gradle-wrapper.jar — a binary nobody can
      # review in a diff. This generates the wrapper from the version pinned
      # in gradle/wrapper/gradle-wrapper.properties instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pin it. Without this the action installs the newest Gradle — 9.x —
          # and `gradle wrapper` below runs under that, configuring the project
          # before the wrapper it generates is ever used. AGP 8.x does not
          # support Gradle 9, so the build failed during that very step.
          gradle-version: '8.14.3'

      - name: Generate the wrapper
        working-directory: android-native
        run: gradle wrapper --gradle-version 8.14.3

      - name: Unit tests
        working-directory: android-native
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: android-native
        run: ./gradlew --no-daemon lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android-native/app/build/reports/tests/**
            android-native/app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Build debug APK
        working-directory: android-native
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: habiterall-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Release APK
    runs-on: ubuntu-latest
    needs: build
    # A push to main, or a deliberate manual run. Never a pull request: a PR
    # validates, it does not publish — and a fork PR cannot read the signing
    # secrets anyway, so it would only ever produce a confusing unsigned
    # release.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      || github.event_name == 'workflow_dispatch'

    # Only this job publishes, so only this job gets write. The build job
    # above runs on every fork PR with read-only scope.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pin it. Without this the action installs the newest Gradle — 9.x —
          # and `gradle wrapper` below runs under that, configuring the project
          # before the wrapper it generates is ever used. AGP 8.x does not
          # support Gradle 9, so the build failed during that very step.
          gradle-version: '8.14.3'

      - name: Generate the wrapper
        working-directory: android-native
        run: gradle wrapper --gradle-version 8.14.3

      # Optional: without ANDROID_KEYSTORE_BASE64 the build produces an
      # unsigned APK rather than failing, so a fork can still build one.
      # The emptiness check lives in the script, not in `if:` — a step's own
      # `env:` block is not visible to its condition.
      - name: Decode the signing keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "No keystore secret set — the APK will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android-native
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: habiterall-release-apk
          path: android-native/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach the APK to the release
        uses: softprops/action-gh-release@v2
        with:
          files: android-native/app/build/outputs/apk/release/*.apk
          # Releases are cut by merging, not tagging, so the tag is derived
          # from the commit. `android-latest` is moved each time; the
          # commit-specific tag gives every build a stable permalink.
          tag_name: android-${{ github.sha }}
          name: Android client (${{ github.sha }})
          body: |
            Native Android client for habiterall.

            Install with `adb install habiterall-release.apk`, or copy it to
            the phone and open it (you will need to allow installing from
            unknown sources).

            On first launch, enter your server address — a LAN address such as
            `http://192.168.1.50:3000`, or an `https://` URL for anything
            reachable from the internet.
