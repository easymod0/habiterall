# Builds the native Android client.
#
#   - PULL REQUEST — unit tests, lint and a debug APK. Never publishes.
#   - PUSH TO MASTER — the same. Merging does NOT ship: release.yml builds the
#     signed APK and attaches it to a release, and only a tag starts that.
#   - MANUAL — the same, for a branch you want an APK from.
#
# Only runs when something that can actually affect the client changes: its
# own sources, this workflow, or the two shared files whose contract it
# hard-codes.
#
# Signing is optional. Without the secrets the release build still succeeds and
# produces an unsigned APK, which is enough for sideloading via `adb install`.

name: Android (native)

on:
  # A `paths` filter applies to TAG pushes too, and a tag changes no files —
  # so a block pairing `tags:` with `paths:` matches nothing at all. Releases
  # are therefore driven by a push to main rather than by tagging, which also
  # matches how the rest of this repo publishes.
  push:
    branches: [master]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
      # The Kotlin client mirrors parts of the shared code BY HAND, so a change
      # to any of these can break it even though no Kotlin file moved. Each has a
      # counterpart in the app:
      #
      #   types.js / constants.js  the REST contract — field names, the x1000
      #                            entry scaling, the sentinel values
      #   ui/time.js               ReminderTime.kt is a deliberate mirror, pinned
      #                            to the same examples, because both clients
      #                            write the same reminder_time
      #   notify.js                AppSettings.androidRemindersEnabled encodes the
      #                            channel id and the "absent means enabled"
      #                            default from DEFAULT_CHANNELS
      #   validate.js              the reminder-prompt cap the dialog applies with
      #                            .take(200)
      #
      # Keep this list and that set of mirrors in step. A shared file the app
      # copies, and that is not listed here, is a change that can break the
      # client with nothing to catch it.
      - 'shared/src/types.js'
      - 'shared/src/constants.js'
      - 'shared/src/notify.js'
      - 'shared/src/validate.js'
      - 'shared/public/ui/time.js'
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
      - 'shared/src/types.js'
      - 'shared/src/constants.js'
      - 'shared/src/notify.js'
      - 'shared/src/validate.js'
      - 'shared/public/ui/time.js'
  workflow_dispatch:

# Read-only by default; only the release job needs to publish, and it asks
# for write itself. The build job runs on every fork PR and must not carry
# write scope it never uses.
permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The repo does not commit gradle-wrapper.jar — a binary nobody can
      # review in a diff. This generates the wrapper from the version pinned
      # in gradle/wrapper/gradle-wrapper.properties instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pin it. Without this the action installs the newest Gradle — 9.x —
          # and `gradle wrapper` below runs under that, configuring the project
          # before the wrapper it generates is ever used. AGP 8.x does not
          # support Gradle 9, so the build failed during that very step.
          gradle-version: '8.14.3'

      - name: Generate the wrapper
        working-directory: android-native
        run: gradle wrapper --gradle-version 8.14.3

      - name: Unit tests
        working-directory: android-native
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: android-native
        run: ./gradlew --no-daemon lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android-native/app/build/reports/tests/**
            android-native/app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Build debug APK
        working-directory: android-native
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: habiterall-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # The signed release APK is built by release.yml, from a tag. Merging to
  # master should not produce a release, so it no longer does — this workflow's
  # job is to prove the client still compiles and its tests still pass.
