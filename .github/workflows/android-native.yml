# Builds the native Android client.
#
# Two modes:
#   - on a pull request or a push touching android-native/, build a debug APK
#     and run the unit tests, so a broken client is caught before merge
#   - on a tag or a manual run, build a release APK and attach it to a release
#
# Signing is optional. Without the secrets the release build still succeeds and
# produces an unsigned APK, which is enough for sideloading via `adb install`.

name: Android (native)

on:
  push:
    branches: [main]
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
    tags: ['android-v*']
  pull_request:
    paths:
      - 'android-native/**'
      - '.github/workflows/android-native.yml'
  workflow_dispatch:
    inputs:
      release:
        description: 'Build a release APK and attach it to a release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The repo does not commit gradle-wrapper.jar — a binary nobody can
      # review in a diff. This generates the wrapper from the version pinned
      # in gradle/wrapper/gradle-wrapper.properties instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pin it. Without this the action installs the newest Gradle — 9.x —
          # and `gradle wrapper` below runs under that, configuring the project
          # before the wrapper it generates is ever used. AGP 8.x does not
          # support Gradle 9, so the build failed during that very step.
          gradle-version: '8.14.3'

      - name: Generate the wrapper
        working-directory: android-native
        run: gradle wrapper --gradle-version 8.14.3

      - name: Unit tests
        working-directory: android-native
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        working-directory: android-native
        run: ./gradlew --no-daemon lintDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android-native/app/build/reports/tests/**
            android-native/app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Build debug APK
        working-directory: android-native
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: habiterall-debug-apk
          path: android-native/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Release APK
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/android-v') || inputs.release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Pin it. Without this the action installs the newest Gradle — 9.x —
          # and `gradle wrapper` below runs under that, configuring the project
          # before the wrapper it generates is ever used. AGP 8.x does not
          # support Gradle 9, so the build failed during that very step.
          gradle-version: '8.14.3'

      - name: Generate the wrapper
        working-directory: android-native
        run: gradle wrapper --gradle-version 8.14.3

      # Optional: without ANDROID_KEYSTORE_BASE64 the build produces an
      # unsigned APK rather than failing, so a fork can still build one.
      # The emptiness check lives in the script, not in `if:` — a step's own
      # `env:` block is not visible to its condition.
      - name: Decode the signing keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "No keystore secret set — the APK will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android-native
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: habiterall-release-apk
          path: android-native/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach the APK to the release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-native/app/build/outputs/apk/release/*.apk
          body: |
            Native Android client for habiterall.

            Install with `adb install habiterall-release.apk`, or copy it to
            the phone and open it (you will need to allow installing from
            unknown sources).

            On first launch, enter your server address — a LAN address such as
            `http://192.168.1.50:3000`, or an `https://` URL for anything
            reachable from the internet.
