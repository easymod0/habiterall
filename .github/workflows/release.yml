# Cuts a release: both APKs, both Docker images, and notes listing what
# changed since the last one.
#
# This is the ONLY workflow that publishes anything. Merging to master runs the
# tests and stops there — a release is a decision, taken either by tagging:
#
#   git tag v1.4.0 && git push origin v1.4.0
#
# or from the Actions tab (Release → Run workflow), which is the safer route:
# it defaults to publishing nothing, so it can be tried first.
#
#   version blank  ->  the next PATCH, derived from the highest vX.Y.Z tag
#   version 1.4.0  ->  exactly that
#
# Patch is automatic because it is the common case, and typing it is the one
# place a release can silently go backwards. Major and minor are judgement
# calls and stay manual.
#
# Image pushing skips itself, loudly, when its credentials are absent, so a
# fresh clone still produces a release. Signing does NOT skip: an unsigned APK
# cannot be installed on any device, so a publishing run without the keystore
# secrets fails rather than attaching a file nobody can use. See
# .github/workflows/README.md.

name: Release

on:
  push:
    # Only vX.Y.Z. `v*` would fire on any tag beginning with v, including the
    # android-v* tags the Android workflows use for their own builds.
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.4.0 (no leading v). Leave blank to bump the patch.'
        required: false
        type: string
      dry_run:
        description: 'Build everything but publish nothing'
        required: false
        default: true
        type: boolean

# The release job needs to create a release; nothing else needs write access.
permissions:
  contents: read

concurrency:
  # Two releases at once would race for the same tag and the same image tags.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- version
  # Everything downstream reads its version from here, so the APKs, the images
  # and the release notes cannot disagree about what is being shipped.
  version:
    name: Version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      code: ${{ steps.v.outputs.code }}
      previous: ${{ steps.v.outputs.previous }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      # Full history and tags: the changelog is a diff between two of them.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Resolve the version
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            PUBLISH=true
          elif [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION#v}"
            TAG="v${VERSION}"
            # A manual run defaults to publishing nothing, so trying the
            # workflow out cannot create a release by accident.
            if [ "${DRY_RUN}" = "false" ]; then PUBLISH=true; else PUBLISH=false; fi
          else
            # No version given: ship the next patch. A patch release is the
            # common case and typing the number is both a chore and the only
            # place a release can silently go backwards, so it is derived.
            # Major and minor are judgement calls and stay manual — pass a
            # version for those.
            #
            # Only exact vX.Y.Z tags count as a base. A pre-release such as
            # v1.2.3-rc1 would make `$((PATCH + 1))` fail on "3-rc1", and
            # bumping from one would skip the final release it precedes;
            # anyone cutting pre-releases is passing a version anyway.
            LATEST=$(git tag --list 'v[0-9]*' --sort=-v:refname \
                      | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            if [ -z "$LATEST" ]; then
              echo "::error title=Nothing to bump from::No vX.Y.Z tag exists yet, so there is no patch to increment. Pass an explicit version for the first release."
              exit 1
            fi
            IFS=. read -r M N P <<< "${LATEST#v}"
            VERSION="$M.$N.$(( P + 1 ))"
            TAG="v${VERSION}"
            if [ "${DRY_RUN}" = "false" ]; then PUBLISH=true; else PUBLISH=false; fi
            echo "::notice title=Auto-bumped::No version given; $LATEST -> $TAG"
          fi

          # Refuse to reuse a tag when actually publishing. Two dispatches in
          # flight together would otherwise compute the same next patch, and the
          # second would rediscover the collision only after building
          # everything — or worse, quietly attach its assets to the first one's
          # release. A dry run is left alone: re-running one against an existing
          # version is a normal thing to do.
          if [ "$PUBLISH" = "true" ] && [ "${GITHUB_REF_TYPE}" != "tag" ] \
             && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error title=Tag already exists::$TAG is already tagged. Pass a different version, or delete the tag if the release was abandoned."
            exit 1
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::\"$VERSION\" is not a semver version (expected 1.4.0)"
            exit 1
          fi

          # Android's versionCode must increase monotonically and is an integer,
          # so it is derived rather than tracked: 1.4.0 -> 10400, 2.13.7 -> 21307.
          # Two digits per component caps minor and patch at 99, which is fine
          # and is stated here so a 100th patch fails loudly rather than
          # colliding with the next minor.
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "::error::minor and patch must be < 100 for the versionCode scheme"
            exit 1
          fi
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

          # The previous release, for the changelog. Excludes the tag being
          # released (which exists already on a tag-triggered run) and the
          # android-* tags, which are not releases of the whole project.
          PREVIOUS=$(git tag --list 'v[0-9]*' --sort=-v:refname \
                      | grep -vFx "$TAG" | head -1 || true)

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "code=$CODE"
            echo "previous=$PREVIOUS"
            echo "publish=$PUBLISH"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $TAG (versionCode $CODE), previous: ${PREVIOUS:-none}, publish: $PUBLISH"

      - name: Write the changelog
        env:
          TAG: ${{ steps.v.outputs.tag }}
          PREVIOUS: ${{ steps.v.outputs.previous }}
        run: |
          set -euo pipefail

          # A tag-triggered run has the tag; a manual one is releasing HEAD.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            HEAD_REF="$TAG"
          else
            HEAD_REF="$GITHUB_SHA"
          fi

          if [ -n "$PREVIOUS" ]; then
            RANGE="$PREVIOUS..$HEAD_REF"
            echo "## What changed since $PREVIOUS" > notes.md
          else
            RANGE="$HEAD_REF"
            echo '## What changed' > notes.md
          fi
          echo >> notes.md

          # Grouped by the subject prefix the commits in this repository
          # actually use (`web:`, `android:`, `fix:`, `docs:`), with everything
          # else under Other rather than dropped — a changelog that silently
          # omits commits is worse than one that is untidy.
          emit() {
            local heading="$1" pattern="$2"
            local lines
            lines=$(git log --no-merges --pretty='%s|%h' "$RANGE" \
                    | grep -E "$pattern" || true)
            [ -z "$lines" ] && return 0
            echo "### $heading" >> notes.md
            while IFS='|' read -r subject sha; do
              echo "- $subject (\`$sha\`)" >> notes.md
            done <<< "$lines"
            echo >> notes.md
          }

          emit 'Fixes'        '^(fix|bug)[:(]'
          emit 'Features'     '^(feat|feature)[:(]'
          emit 'Web app'      '^(web|shared|ui)[:(]'
          emit 'Android'      '^android[:(]'
          emit 'Server'       '^(personal|cloud|api|db)[:(]'
          emit 'Tests and CI' '^(test|ci|test/[a-z]+)[:(]'
          emit 'Docs'         '^docs[:(]'

          # Anything that matched no prefix, by subtraction rather than by a
          # negative lookahead — `grep -P` is not guaranteed on a runner. A
          # changelog that silently drops commits is worse than an untidy one.
          KNOWN='^(fix|bug|feat|feature|web|shared|ui|android|personal|cloud|api|db|test|ci|docs)[:(]'
          OTHER=$(git log --no-merges --pretty='%s|%h' "$RANGE" | grep -vE "$KNOWN" || true)
          if [ -n "$OTHER" ]; then
            echo '### Other' >> notes.md
            while IFS='|' read -r subject sha; do
              [ -z "$subject" ] && continue
              echo "- $subject (\`$sha\`)" >> notes.md
            done <<< "$OTHER"
            echo >> notes.md
          fi

          # The "Install" half is appended by the release job, not here: this
          # job runs before anything is built, so all it could do is promise
          # assets and hope.
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md
          retention-days: 7

  # ------------------------------------------------------------------- tests
  # A release runs the same suite a pull request does. Tagging a commit whose
  # tests were never run is the failure mode a release pipeline exists to stop.
  verify:
    name: Tests
    uses: ./.github/workflows/ci.yml

  # -------------------------------------------------------------------- apks
  apks:
    name: Native APK
    runs-on: ubuntu-latest
    needs: [version, verify]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check for a signing keystore
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PUBLISH: ${{ needs.version.outputs.publish }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"

          # An unsigned APK cannot be installed. Not "needs a setting changed",
          # not "sideload only" — Android's package manager rejects it outright
          # with INSTALL_PARSE_FAILED_NO_CERTIFICATES, which reaches the user as
          # a bare "App not installed". Publishing one attaches a file to a
          # release that nobody can use, and the only warning was a ::notice::
          # nobody reads. So a real release stops here.
          if [ "$PUBLISH" = "true" ]; then
            echo "::error title=No signing keystore::ANDROID_KEYSTORE_BASE64 is not set, so this release would attach an APK that cannot be installed on any device. Set the four signing secrets (see .github/workflows/README.md), or run with publish disabled to build without releasing."
            exit 1
          fi

          # A dry run is allowed to produce an unsigned APK: it proves the build
          # works, and nothing reaches a user.
          echo "::warning title=Unsigned APK::No keystore configured. This build will produce an APK that CANNOT be installed. Fine for validation; a publishing run would fail here."

      - name: Decode the keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Exported here rather than in the build step's `env:`, so that with no
          # keystore the variable is genuinely ABSENT instead of set to an empty
          # string. Gradle reads it with getenv, where "" is not null.
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # AGP 8.x does not support Gradle 9, and `gradle wrapper` below runs
      # under whatever this puts on PATH — so the version is pinned here as
      # well as in gradle-wrapper.properties.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # The wrapper jar is deliberately not committed (a binary nobody can
      # review in a diff), so it is generated from the pinned version.
      - name: Generate the Gradle wrapper
        working-directory: android-native
        run: gradle wrapper --gradle-version 8.14.3

      - name: Build the native APK
        working-directory: android-native
        env:
          # ANDROID_KEYSTORE_PATH is exported by the decode step above, and only
          # when there is something to decode.
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PversionName='${{ needs.version.outputs.version }}' \
            -PversionCode='${{ needs.version.outputs.code }}'

      - name: Name the APK after the version
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find android-native/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" "dist/habiterall-native-${{ needs.version.outputs.version }}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apk-native
          path: dist/*.apk
          retention-days: 7

  # ------------------------------------------------------------------ images
  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [version, verify]
    # `packages: write` is what lets the automatic GITHUB_TOKEN push to GHCR.
    # That is the whole reason GHCR is the default here: it needs no secret at
    # all, so a fresh clone of this repository can publish images without its
    # owner configuring anything.
    permissions:
      contents: read
      packages: write
    env:
      # docker/build-push-action uploads a `<owner>~<repo>~<id>.dockerbuild`
      # build record as a workflow artifact for each build. Nothing here reads
      # them, they are ~100KB each, and they broke the release once by being
      # picked up by a download-everything step. Off at the source.
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image names
        id: names
        env:
          OWNER: ${{ github.repository_owner }}
          DOCKERHUB_NS: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          # A registry path must be lowercase; a GitHub owner need not be.
          GH_OWNER=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "ghcr_personal=ghcr.io/$GH_OWNER/habiterall-personal" >> "$GITHUB_OUTPUT"
          echo "ghcr_cloud=ghcr.io/$GH_OWNER/habiterall-cloud" >> "$GITHUB_OUTPUT"

          # Docker Hub is optional and additional. Only named when its
          # credentials exist, so the tag list below stays empty otherwise.
          if [ -n "$DOCKERHUB_USER" ]; then
            NS="${DOCKERHUB_NS:-$DOCKERHUB_USER}"
            echo "hub_personal=docker.io/$NS/habiterall-personal" >> "$GITHUB_OUTPUT"
            echo "hub_cloud=docker.io/$NS/habiterall-cloud" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to push
        id: mode
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          PUBLISH: ${{ needs.version.outputs.publish }}
        run: |
          set -euo pipefail

          # A dry run builds everything and pushes nowhere, so the workflow can
          # be tried out without leaving anything behind.
          if [ "$PUBLISH" = "true" ]; then
            echo "ghcr=true" >> "$GITHUB_OUTPUT"
          else
            echo "ghcr=false" >> "$GITHUB_OUTPUT"
            echo "::notice::dry run — images are built but pushed nowhere."
          fi

          if [ "$PUBLISH" = "true" ] && [ -n "$HUB_USER" ] && [ -n "$HUB_TOKEN" ]; then
            echo "hub=true" >> "$GITHUB_OUTPUT"
          else
            echo "hub=false" >> "$GITHUB_OUTPUT"
            if [ -z "$HUB_USER" ]; then
              echo "::notice::no DOCKERHUB_* secrets; publishing to GHCR only."
            fi
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.mode.outputs.ghcr == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: steps.mode.outputs.hub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # X.Y.Z, X.Y and latest, on every registry in play, so a deployment can
      # pin as tightly as it likes.
      #
      # Except below 1.0.0, where the X.Y tag is dropped. A moving `1.4` tag is
      # a promise that anything it points at is compatible with anything else it
      # points at — which is what a minor series means once a project is
      # stable. Under semver, 0.x carries no such guarantee: any 0.0.z may break
      # the last. Publishing `0.0` would make that promise anyway, and at this
      # version it is also indistinguishable from `latest`, so it says nothing
      # while implying something untrue. It comes back on its own at 1.0.0.
      - name: Tags
        id: tags
        env:
          V: ${{ needs.version.outputs.version }}
          GHCR_PERSONAL: ${{ steps.names.outputs.ghcr_personal }}
          GHCR_CLOUD: ${{ steps.names.outputs.ghcr_cloud }}
          HUB_PERSONAL: ${{ steps.names.outputs.hub_personal }}
          HUB_CLOUD: ${{ steps.names.outputs.hub_cloud }}
          WITH_HUB: ${{ steps.mode.outputs.hub }}
        run: |
          set -euo pipefail
          MINOR="${V%.*}"
          MAJOR="${V%%.*}"

          # `if` rather than `[ … ] && …`: under `set -e` a test that fails as
          # the last command of a function or a block takes the whole step with
          # it, which is a memorable way to lose an afternoon.
          tags_for() {
            local repo="$1"
            if [ -n "$repo" ]; then
              printf '%s:%s\n' "$repo" "$V"
              if [ "$MAJOR" != "0" ]; then printf '%s:%s\n' "$repo" "$MINOR"; fi
              printf '%s:latest\n' "$repo"
            fi
          }

          {
            echo 'personal<<EOF'
            tags_for "$GHCR_PERSONAL"
            if [ "$WITH_HUB" = "true" ]; then tags_for "$HUB_PERSONAL"; fi
            echo EOF
            echo 'cloud<<EOF'
            tags_for "$GHCR_CLOUD"
            if [ "$WITH_HUB" = "true" ]; then tags_for "$HUB_CLOUD"; fi
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: personal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: habiterall-personal/Dockerfile
          push: ${{ steps.mode.outputs.ghcr == 'true' }}
          tags: ${{ steps.tags.outputs.personal }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: cloud
        uses: docker/build-push-action@v6
        with:
          context: .
          file: habiterall-cloud/Dockerfile
          push: ${{ steps.mode.outputs.ghcr == 'true' }}
          tags: ${{ steps.tags.outputs.cloud }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ steps.mode.outputs.ghcr }}" = "true" ]; then
              echo "### Images pushed"
            else
              echo "### Images built, not pushed"
            fi
            echo '```'
            echo "${{ steps.tags.outputs.personal }}"
            echo "${{ steps.tags.outputs.cloud }}"
            echo '```'
            if [ "${{ steps.mode.outputs.hub }}" != "true" ]; then
              echo "Docker Hub was skipped (no DOCKERHUB_USERNAME / DOCKERHUB_TOKEN)."
            fi
            echo
            echo "If \`docker pull\` asks for credentials, the package is private:"
            echo "Packages → habiterall-personal → Package settings → Change"
            echo "visibility → Public. Once, and it stays that way."
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------------- release
  release:
    name: Publish the release
    runs-on: ubuntu-latest
    needs: [version, apks, images]
    # The one job that writes to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Named, not "everything". Downloading every artifact in the run also
      # picked up the two `<owner>~<repo>~<id>.dockerbuild` build records that
      # docker/build-push-action uploads on its own, and one of them failed to
      # extract — which failed the release over a file it has no use for.
      - name: The APK
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: dist

      - name: The changelog
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      # Now that the assets are in hand, say what is actually here — rather than
      # what the version job hoped would be.
      - name: Describe what is being released
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -la dist

          OWNER=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')

          {
            echo
            echo '### Install'
            echo
            echo '**Docker** — `linux/amd64` and `linux/arm64`:'
            echo
            echo '```bash'
            echo "# single user, SQLite, no login"
            echo "docker pull ghcr.io/$OWNER/habiterall-personal:$V"
            echo
            echo "# multi user, Postgres, OIDC"
            echo "docker pull ghcr.io/$OWNER/habiterall-cloud:$V"
            echo '```'
            echo
            # Must agree with the Tags step: no moving minor tag below 1.0.0.
            if [ "${V%%.*}" = "0" ]; then
              echo "Also tagged \`latest\`."
            else
              echo "Also tagged \`$(echo "$V" | cut -d. -f1-2)\` and \`latest\`."
            fi
            echo

            if ls dist/*.apk >/dev/null 2>&1; then
              echo '**Android** — attached below:'
              echo
              for apk in dist/*.apk; do
                name=$(basename "$apk")
                size=$(( $(stat -c%s "$apk") / 1024 / 1024 ))
                case "$name" in
                  *native*) what='the native client — notification actions, reminders' ;;
                  *)        what='' ;;
                esac
                echo "- \`$name\` (${size} MB) — $what"
              done
              echo
              echo 'Sideloading needs *Install unknown apps* enabled for whichever app'
              echo 'you open the file with. If a previous build is installed and was'
              echo 'signed with a different key — a debug build, for instance — uninstall'
              echo 'it first: Android refuses the update, reporting only "App not'
              echo 'installed".'
            fi
          } >> notes.md

          echo "--- notes ---"
          cat notes.md

      - name: Create the release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail

          # A manually-dispatched release has no tag yet; tag the commit that
          # was built so the release points at something reproducible.
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

          gh release create "$TAG" \
            --title "habiterall $TAG" \
            --notes-file notes.md \
            dist/*.apk

      - name: Dry run summary
        if: needs.version.outputs.publish != 'true'
        run: |
          {
            echo "### Dry run — nothing was published"
            echo
            echo "Everything built. Re-run with **dry_run: false**, or push the tag,"
            echo "to publish. Assets that would have been attached:"
            echo '```'
            ls dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
