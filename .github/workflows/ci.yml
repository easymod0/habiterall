# Build and test on every pull request and push to main.
#
# Five jobs, deliberately separate so a failure names the thing that broke
# rather than "CI failed":
#
#   test     unit tests (fast, no services)
#   types    JSDoc type checking via tsc --noEmit
#   browser  the real-browser UI suites against a running personal instance
#   tenancy  the adversarial multi-tenant isolation attacks, against Postgres
#   docker   both images actually build
#
# The browser and tenancy jobs exist because they catch classes of bug the
# unit tests structurally cannot: a CSS rule silently defeating the `hidden`
# attribute, and a cross-user data leak.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    # Version tags publish semver-tagged images; without this the tag patterns
    # in the publish job could never match.
    tags: ['v*']
  workflow_dispatch:

# Read-only. Images go to Docker Hub with its own credentials, so nothing here
# needs write access to the repository.
permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # JSDoc types checked with tsc --noEmit: no build step, but a renamed
      # field in `shared` now fails here instead of at runtime in two apps.
      - run: npm run typecheck

  browser:
    name: Browser suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Start the personal edition
        run: |
          mkdir -p habiterall-personal/data
          (cd habiterall-personal && \
            PORT=3000 HABITERALL_DB=./data/ci.db node src/server.js &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/healthz

      - name: Run the browser suites
        # The runner ships Chrome; the harnesses drive it over the DevTools
        # protocol and reset to known fixtures before each suite.
        env:
          BASE: http://localhost:3000
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:browser

  tenancy:
    name: Multi-tenant isolation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: habiterall
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: testpw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U owner -d habiterall"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply migrations
        working-directory: habiterall-cloud
        env:
          DATABASE_URL_ADMIN: postgres://owner:testpw@localhost:5432/habiterall
          APP_DB_PASSWORD: apptestpw
        run: node src/db/migrate.js

      - name: Attack the isolation
        working-directory: habiterall-cloud
        env:
          DATABASE_URL: postgres://habiterall_app:apptestpw@localhost:5432/habiterall
          ADMIN_URL: postgres://owner:testpw@localhost:5432/habiterall
        run: node test/tenancy.integration.mjs

  cloud:
    name: Cloud API (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: habiterall
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: testpw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U owner -d habiterall"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Apply migrations
        working-directory: habiterall-cloud
        env:
          DATABASE_URL_ADMIN: postgres://owner:testpw@localhost:5432/habiterall
          APP_DB_PASSWORD: apptestpw
        run: node src/db/migrate.js

      # The cloud API was previously only ever exercised by hand. These are
      # the paths where a regression is most expensive: per-user isolation,
      # settings, and the import writer.
      - name: Exercise the cloud API
        working-directory: habiterall-cloud
        env:
          DATABASE_URL: postgres://habiterall_app:apptestpw@localhost:5432/habiterall
          ADMIN_URL: postgres://owner:testpw@localhost:5432/habiterall
        run: node test/api.integration.mjs

      # Exports every format and imports it back, asserting the data is
      # unchanged. A silent encoding regression here loses real history and
      # would otherwise only surface when someone restores a backup.
      - name: Backup round-trip fidelity
        working-directory: habiterall-cloud
        env:
          DATABASE_URL: postgres://habiterall_app:apptestpw@localhost:5432/habiterall
          ADMIN_URL: postgres://owner:testpw@localhost:5432/habiterall
        run: node test/roundtrip.integration.mjs

      # The reminder scheduler's storage adapter: the scan-then-withUser walk,
      # and a watermark that is per account and keyed on the user's own local
      # date. Sends go to a fake fetch, never to Discord.
      - name: Reminder scheduling per account
        working-directory: habiterall-cloud
        env:
          DATABASE_URL: postgres://habiterall_app:apptestpw@localhost:5432/habiterall
          ADMIN_URL: postgres://owner:testpw@localhost:5432/habiterall
        run: node test/notify.integration.mjs

  roundtrip:
    name: Backup round-trip (personal)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Runs against a throwaway SQLite file on an ephemeral port, so it needs
      # no services and no fixtures beyond its own.
      - name: Export and re-import every format
        working-directory: habiterall-personal
        run: node test/roundtrip.integration.mjs

      # The native Android client is strongly typed and refuses anything that
      # does not match. SQLite returning `archived: 0` where the contract says
      # boolean broke it on a real phone, and nothing in the web-facing suite
      # noticed because 0 and false are both falsy.
      - name: API shape for typed clients
        working-directory: habiterall-personal
        run: node test/apishape.integration.mjs

      # Server-sent reminders, against a real database. The scheduling rules
      # are unit-tested; what this covers is the watermark surviving a round
      # trip, which is the difference between one reminder and one a minute for
      # half an hour. It posts to a fake fetch, never to Discord.
      - name: Reminder delivery and its watermark
        working-directory: habiterall-personal
        run: node test/notify.integration.mjs

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the personal image
        run: docker build -f habiterall-personal/Dockerfile -t habiterall:ci .

      - name: Build the cloud image
        run: docker build -f habiterall-cloud/Dockerfile -t habiterall-cloud:ci .

      - name: Smoke-test the personal image
        run: |
          docker run -d --name hab -p 3000:3000 habiterall:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/healthz >/dev/null && break
            sleep 1
          done
          # The UI is served from the shared workspace; a broken COPY in the
          # Dockerfile shows up here rather than at runtime for a user.
          for path in / /app-entry.js /shared/app.js /style.css /sw.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            echo "  $path -> $code"
            [ "$code" = "200" ] || { docker logs hab; exit 1; }
          done
          docker rm -f hab

  # Publishing is a separate job so the build-and-smoke-test above stays a
  # required check that never depends on registry credentials existing.
  publish:
    name: Publish images
    runs-on: ubuntu-latest
    needs: [docker, test, types]
    # Only from the canonical branch or a version tag: a pull request from a
    # fork cannot read secrets anyway, and publishing every PR would fill the
    # registry with throwaway tags.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v4

      # Everything below is skipped when the credentials are absent, so this
      # job is green on a fresh clone with nothing configured. Secrets cannot
      # be referenced in a job-level `if:`, hence the explicit gate here that
      # every later step reads.
      - name: Check for registry credentials
        id: creds
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials found — images will be pushed."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are not set; skipping publish."
          fi

      # The namespace to push under. Defaults to the Docker Hub username, so
      # only the two secrets are strictly required; set DOCKERHUB_NAMESPACE as
      # a repository variable to push to an organisation instead.
      - name: Resolve image names
        if: steps.creds.outputs.configured == 'true'
        id: names
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          NS="${NAMESPACE:-$USERNAME}"
          echo "personal=docker.io/$NS/habiterall-personal" >> "$GITHUB_OUTPUT"
          echo "cloud=docker.io/$NS/habiterall-cloud" >> "$GITHUB_OUTPUT"
          echo "Publishing to $NS/habiterall-personal and $NS/habiterall-cloud"

      - name: Set up Buildx
        if: steps.creds.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.creds.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # `latest` only from main; a vX.Y.Z tag also publishes X.Y.Z and X.Y, so
      # a deployment can pin however tightly it wants.
      - name: Tags for the personal image
        if: steps.creds.outputs.configured == 'true'
        id: meta-personal
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.personal }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push the personal image
        if: steps.creds.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: habiterall-personal/Dockerfile
          push: true
          tags: ${{ steps.meta-personal.outputs.tags }}
          labels: ${{ steps.meta-personal.outputs.labels }}
          # linux/arm64 covers a Raspberry Pi, which is exactly the kind of
          # machine the personal edition is meant to run on.
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tags for the cloud image
        if: steps.creds.outputs.configured == 'true'
        id: meta-cloud
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.cloud }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push the cloud image
        if: steps.creds.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: habiterall-cloud/Dockerfile
          push: true
          tags: ${{ steps.meta-cloud.outputs.tags }}
          labels: ${{ steps.meta-cloud.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.creds.outputs.configured }}" = "true" ]; then
            echo "### Published" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.meta-personal.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.meta-cloud.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Publish skipped"
              echo
              echo "Set \`DOCKERHUB_USERNAME\` and \`DOCKERHUB_TOKEN\` as repository"
              echo "secrets to publish images. See \`.github/workflows/README.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
