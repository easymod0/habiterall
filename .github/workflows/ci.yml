# Build and test on every pull request, and once a night against master.
#
# Five jobs, deliberately separate so a failure names the thing that broke
# rather than "CI failed":
#
#   test     unit tests (fast, no services)
#   types    JSDoc type checking via tsc --noEmit
#   browser  the real-browser UI suites against a running personal instance
#   tenancy  the adversarial multi-tenant isolation attacks, against Postgres
#   compose  every compose file resolves, and the README matches them
#   docker   both images actually build
#
# The browser and tenancy jobs exist because they catch classes of bug the
# unit tests structurally cannot: a CSS rule silently defeating the `hidden`
# attribute, and a cross-user data leak. `compose` is the same argument for a
# third: each edition's compose file now `extends:` the published example
# instead of repeating it, and whether that merge produced the right project is
# a question only Compose itself can answer.

name: CI

on:
  pull_request:

  # No `push:` trigger, and that is a change from how this started. It ran on
  # every push to master because a PR proves "this branch against the base as it
  # was when the run started" and not "master after the merge" — two green PRs
  # merging into a broken master, a squash producing a commit neither PR tested,
  # a direct push skipping checks entirely.
  #
  # The ruleset on master closes all three: a pull request is REQUIRED (so there
  # are no direct pushes), squash is the only merge method, every job below is a
  # required check, and `strict_required_status_checks_policy` means the branch
  # must be up to date with master before it can merge. So the tree the PR run
  # tested IS the tree that becomes master. The post-merge run was re-testing a
  # commit it had just tested under another name.
  #
  # Two backstops remain for what a PR run structurally cannot cover. Below is
  # the first; the second is release.yml, which `uses:` this workflow, so the
  # exact commit being released is tested again before anything is published.
  #
  # If the required-check list is ever emptied, or `strict` turned off, put the
  # push trigger back — those settings are what makes its absence safe.

  # The failures that arrive with no commit at all: the runner's preinstalled
  # Chrome moving under the browser suites, base images the docker job pulls,
  # `ubuntu-latest` itself migrating, an `actions/*` node runtime deprecating,
  # the Postgres service container tag. Nothing above can catch those, because
  # nothing about the repository changed. Found on a schedule they are one
  # morning's known breakage; found during an unrelated pull request they get
  # attributed to that pull request, which is the expensive way to learn it.
  #
  # Not on the hour: GitHub queues `0 * * * *` heavily and delays it.
  schedule:
    - cron: '17 5 * * *'

  # No `tags:`. A tag already runs the whole suite through release.yml, which
  # calls this workflow; triggering on the tag as well ran everything twice.
  workflow_dispatch:
  # Called by release.yml, so a release runs the same suite a pull request does.
  # Tagging a commit whose tests were never run is the failure a release
  # pipeline exists to prevent.
  workflow_call:

# Read-only. Images go to Docker Hub with its own credentials, so nothing here
# needs write access to the repository.
permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  #
  # Keyed on the EVENT as well as the ref, because several triggers now share
  # `refs/heads/master`: the nightly schedule and a manual dispatch. On the ref
  # alone they land in one group with `cancel-in-progress`, so a dispatch would
  # kill the nightly — and the nightly's whole job is to run unattended, where
  # "cancelled" and "never ran" look the same in the Actions tab.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which of the expensive jobs this change can possibly affect.
  #
  # Only for pull requests. Every other trigger runs the lot: the nightly is
  # asking whether master still builds against today's runner, and a
  # `workflow_call` from release.yml has no base commit to compare against.
  #
  # Filtered at the JOB level, not with a workflow-level `paths:`, and that
  # distinction matters: a workflow that is skipped by `paths` never reports a
  # status, so a required check on it waits for a run that will never arrive and
  # the pull request can never merge. A job skipped by `if:` reports "Success",
  # which a required check accepts.
  #
  # THIS job is a required check in its own right, and that is load bearing. A
  # job skipped because a job it `needs` FAILED also reports "Success" — so if
  # this one ever dies (a checkout error, the script tripping `pipefail`), every
  # job below it skips, each reports Success, and a completely untested pull
  # request goes green. Requiring this job is what turns that into a red check.
  # If you ever trim the required list, this is the entry that cannot go.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.what.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Compare against the base
        id: what
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Not a pull request — running everything."
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "$CHANGED" | sed 's/^/  /'

          # Anything that is not documentation or workflow configuration. There
          # is no finer split worth making here: the browser suites drive a real
          # server, so a change under habiterall-personal/src reaches them, and
          # the Postgres jobs exercise shared/src through the cloud edition. A
          # per-directory matrix would be false precision.
          #
          # The one exception that must NOT be treated as docs: ci.yml itself.
          # A change to this file has to run this file, or a broken pipeline
          # merges green.
          if echo "$CHANGED" | grep -qE '^\.github/workflows/ci\.yml$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "ci.yml itself changed — running everything."
            exit 0
          fi

          if echo "$CHANGED" | grep -qvE '(\.md$|^\.github/|^LICENSE$|^\.gitignore$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "Code changed — running everything."
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "Documentation and workflow configuration only — every other job"
            echo "is skipped. Nothing in this change can affect them: a commit"
            echo "that touches one line of code anywhere lands in the branch"
            echo "above and runs the lot."
          fi

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test

      # The three auth modes end to end, against the real server. In this job
      # rather than a browser one because it needs no browser and no services —
      # it re-execs itself per mode, since auth resolves once at startup.
      - name: Auth modes
        run: npm run test:auth -w habiterall-personal

      # Separate because it RESTARTS the server between assertions, which is the
      # only way to see a session outliving the credential that raised it —
      # every other auth check runs inside one process and cannot.
      - name: Credential change evicts sessions
        run: npm run test:credchange -w habiterall-personal

  types:
    name: Type check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # JSDoc types checked with tsc --noEmit: no build step, but a renamed
      # field in `shared` now fails here instead of at runtime in two apps.
      - run: npm run typecheck

  browser:
    name: Browser suites
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Start the personal edition
        # Both switches off on purpose. These suites drive the app, not the
        # login: with auth on they would meet the setup screen instead of a
        # dashboard, and twenty-two suites resetting fixtures from one address
        # pass the 300/minute API limit long before they find a bug. The
        # sign-in flow and the limits are covered by the two jobs below, which
        # start their own servers configured the other way.
        run: |
          mkdir -p habiterall-personal/data
          (cd habiterall-personal && \
            PORT=3000 HABITERALL_DB=./data/ci.db \
            HABITERALL_AUTH=off HABITERALL_RATE_LIMIT=off node src/server.js &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/healthz

      - name: Run the browser suites
        # The runner ships Chrome; the harnesses drive it over the DevTools
        # protocol and reset to known fixtures before each suite.
        env:
          BASE: http://localhost:3000
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:browser

      - name: Run the sign-in view suite
        # Starts and stops its own server, because it needs auth ON and, for
        # its first half, no account yet — the one configuration the shared
        # runner's single instance cannot be in.
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:signin -w habiterall-personal

  tenancy:
    name: Multi-tenant isolation
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: habiterall
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: testpw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U owner -d habiterall"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Apply migrations
        working-directory: habiterall-cloud
        env:
          DATABASE_URL_ADMIN: postgres://owner:testpw@localhost:5432/habiterall
          APP_DB_PASSWORD: apptestpw
        run: node src/db/migrate.js

      - name: Attack the isolation
        working-directory: habiterall-cloud
        env:
          DATABASE_URL: postgres://habiterall_app:apptestpw@localhost:5432/habiterall
          ADMIN_URL: postgres://owner:testpw@localhost:5432/habiterall
        run: node test/tenancy.integration.mjs

  cloud:
    name: Cloud API (Postgres)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: habiterall
          POSTGRES_USER: owner
          POSTGRES_PASSWORD: testpw
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U owner -d habiterall"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: Apply migrations
        working-directory: habiterall-cloud
        env:
          DATABASE_URL_ADMIN: postgres://owner:testpw@localhost:5432/habiterall
          APP_DB_PASSWORD: apptestpw
        run: node src/db/migrate.js

      # The cloud API was previously only ever exercised by hand. These are
      # the paths where a regression is most expensive: per-user isolation,
      # settings, and the import writer.
      - name: Exercise the cloud API
        working-directory: habiterall-cloud
        env:
          DATABASE_URL: postgres://habiterall_app:apptestpw@localhost:5432/habiterall
          ADMIN_URL: postgres://owner:testpw@localhost:5432/habiterall
        run: node test/api.integration.mjs

      # Exports every format and imports it back, asserting the data is
      # unchanged. A silent encoding regression here loses real history and
      # would otherwise only surface when someone restores a backup.
      - name: Backup round-trip fidelity
        working-directory: habiterall-cloud
        env:
          DATABASE_URL: postgres://habiterall_app:apptestpw@localhost:5432/habiterall
          ADMIN_URL: postgres://owner:testpw@localhost:5432/habiterall
        run: node test/roundtrip.integration.mjs

      # The reminder scheduler's storage adapter: the scan-then-withUser walk,
      # and a watermark that is per account and keyed on the user's own local
      # date. Sends go to a fake fetch, never to Discord.
      - name: Reminder scheduling per account
        working-directory: habiterall-cloud
        env:
          DATABASE_URL: postgres://habiterall_app:apptestpw@localhost:5432/habiterall
          ADMIN_URL: postgres://owner:testpw@localhost:5432/habiterall
        run: node test/notify.integration.mjs

  roundtrip:
    name: Backup round-trip (personal)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      # Runs against a throwaway SQLite file on an ephemeral port, so it needs
      # no services and no fixtures beyond its own.
      - name: Export and re-import every format
        working-directory: habiterall-personal
        run: node test/roundtrip.integration.mjs

      # The native Android client is strongly typed and refuses anything that
      # does not match. SQLite returning `archived: 0` where the contract says
      # boolean broke it on a real phone, and nothing in the web-facing suite
      # noticed because 0 and false are both falsy.
      - name: API shape for typed clients
        working-directory: habiterall-personal
        run: node test/apishape.integration.mjs

      # `/overview` answers two questions with one `end`, and they want
      # different dates: the grid follows the window on screen, the row summary
      # describes the habit today. Only the real route can show them apart.
      - name: The dashboard summary is anchored on today
        working-directory: habiterall-personal
        run: node test/overview.integration.mjs

      # One entry filed under a day that does not exist used to make the Loop
      # export answer 500 for good. The writer's half is unit-tested; only the
      # real route can show that the request now comes back with a file on it
      # and says on the way past which row did not make it.
      - name: The Loop export survives a date that is not a day
        working-directory: habiterall-personal
        run: node test/export-loop.integration.mjs

      # Server-sent reminders, against a real database. The scheduling rules
      # are unit-tested; what this covers is the watermark surviving a round
      # trip, which is the difference between one reminder and one a minute for
      # half an hour. It posts to a fake fetch, never to Discord.
      - name: Reminder delivery and its watermark
        working-directory: habiterall-personal
        run: node test/notify.integration.mjs

  compose:
    name: Compose files
    runs-on: ubuntu-latest
    # Deliberately NOT gated on `changes`. This is the job that guards
    # documentation, so a documentation-only pull request is exactly when it
    # has to run — the README's compose blocks are generated, and a hand edit
    # to one is a change the `code == 'true'` filter calls docs and skips.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci

      - name: The README blocks are what the example files say
        run: npm run docs:compose -- --check

      # `config` interpolates, resolves every `extends:`, and validates the
      # result. The values below are throwaway: nothing is started, and the
      # `:?` guards only need something non-empty.
      - name: Every compose file resolves
        env:
          DB_OWNER_PASSWORD: ci
          APP_DB_PASSWORD: ci
          AUTHENTIK_DB_PASSWORD: ci
          AUTHENTIK_SECRET_KEY: ci
          SESSION_SECRET: ci
          PUBLIC_URL: http://localhost:3100
          OIDC_ISSUER: http://localhost:9000/application/o/habiterall/
          OIDC_CLIENT_ID: ci
          OIDC_CLIENT_SECRET: ci
        run: |
          set -euo pipefail
          for f in examples/docker-compose.*.yml; do
            echo "  $f"
            docker compose -f "$f" config -q
          done
          echo "  habiterall-personal/docker-compose.yml"
          (cd habiterall-personal && docker compose config -q)
          echo "  habiterall-cloud/docker-compose.yml"
          (cd habiterall-cloud && cp ../examples/cloud.env.example .env && docker compose config -q)

      # The point of the restructure is that the edition files inherit an
      # environment block they no longer carry. `config -q` above proves the
      # merge is VALID; this proves it produced what `extends` was for. Getting
      # it wrong is silent in the worst direction — a container that starts
      # with half its configuration missing looks exactly like one that does
      # not, which is precisely what `include:` would have done here.
      - name: extends actually carried the environment across
        run: |
          set -euo pipefail

          check() {  # file, then the names that must appear in it
            local rendered=$1; shift
            for v in "$@"; do
              grep -q -- "$v" "$rendered" \
                || { echo "MISSING $v"; cat "$rendered"; exit 1; }
            done
          }

          (cd habiterall-personal && docker compose config > /tmp/personal.yml)
          # From the extended example, not from this file.
          check /tmp/personal.yml HABITERALL_SESSION_SECRET HABITERALL_RATE_LIMIT \
            HABITERALL_AUTH HABITERALL_UPGRADE_INSECURE HABITERALL_NOTIFY \
            HABITERALL_DB HABITERALL_PASSWORD_HASH TZ habiterall-data
          # And this file's own two lines won: built here, tagged locally, so
          # `--build` does not take over the published image's name.
          check /tmp/personal.yml 'habiterall-personal/Dockerfile' 'image: habiterall:latest'

          # The `:?` guards are answered by cloud.env.example, not by the step
          # above's environment — this step deliberately sets none, so what it
          # renders is what an operator following SETUP.md would get.
          (cd habiterall-cloud && cp ../examples/cloud.env.example .env && docker compose config > /tmp/cloud.yml)
          check /tmp/cloud.yml HABITERALL_NOTIFY_INTERVAL_MS NOTIFY_MAX_ACCOUNTS \
            ALLOW_INSECURE_OIDC SESSION_SECRET DATABASE_URL_ADMIN TZ db-data \
            'habiterall-cloud/Dockerfile'
          # The ordering the schema depends on. It is restated in that file
          # rather than relied on, and a missing one only shows up as the app
          # racing an unmigrated database.
          grep -q 'service_completed_successfully' /tmp/cloud.yml

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Build the personal image
        run: docker build -f habiterall-personal/Dockerfile -t habiterall:ci .

      - name: Build the cloud image
        run: docker build -f habiterall-cloud/Dockerfile -t habiterall-cloud:ci .

      - name: Smoke-test the personal image
        run: |
          docker run -d --name hab -p 3000:3000 habiterall:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/healthz >/dev/null && break
            sleep 1
          done
          # The UI is served from the shared workspace; a broken COPY in the
          # Dockerfile shows up here rather than at runtime for a user.
          for path in / /app-entry.js /shared/app.js /style.css /sw.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$path")
            echo "  $path -> $code"
            [ "$code" = "200" ] || { docker logs hab; exit 1; }
          done
          docker rm -f hab

  # Publishing lives in release.yml, not here. This workflow proves the images
  # BUILD (see the docker job above) and stops there: pushing `latest` on every
  # merge to master made every merge a release, which is the opposite of a
  # decision. `git tag v1.4.0 && git push origin v1.4.0` is the decision.
