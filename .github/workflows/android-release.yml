# Builds a signed Android APK (a Trusted Web Activity wrapping the PWA) and
# attaches it to a GitHub Release.
#
# A pull request — and a push to master — validate that the wrapper still
# builds. Neither publishes: release.yml calls this workflow when a release is
# tagged, and that is the only path that produces an asset. Nothing needs
# installing locally; the JDK and Android SDK live on the runner.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#
#   ANDROID_KEYSTORE_BASE64  the signing keystore, base64-encoded:
#                              base64 -w0 android.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Required repository variable:
#
#   TWA_HOST                 e.g. habits.example.com  (no scheme, no path)
#
# Generate a keystore once, and keep it safe — losing it means you cannot ship
# an update that installs over an existing copy:
#
#   keytool -genkeypair -v -keystore android.keystore \
#     -alias habiterall -keyalg RSA -keysize 2048 -validity 10000

name: Android APK

on:
  # Merging to main ships the wrapper, matching the native client and the
  # Docker images. Only when something that can change the wrapped app moves:
  # the TWA config itself, or the PWA assets it points at (icons, manifest,
  # service worker) — the wrapper embeds no logic of its own beyond those.
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
      - 'shared/public/manifest.json'
      - 'shared/public/icons/**'
      - 'shared/public/sw.js'
  # Validation only on a PR — no signing, no release. See the `release` gate
  # on the publishing steps below.
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-release.yml'
      - 'shared/public/manifest.json'
      - 'shared/public/icons/**'
      - 'shared/public/sw.js'
  workflow_dispatch:
    inputs:
      host:
        description: 'Host to wrap (overrides the TWA_HOST variable)'
        required: false
        type: string
  # Called by release.yml, which passes the version to stamp into the APK's
  # name so the release asset says what it is.
  workflow_call:
    inputs:
      host:
        required: false
        type: string
      version:
        required: false
        type: string

# Read-only by default. Only the build job publishes, and only on main, so
# it asks for write itself rather than granting it to every PR run.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Read-only: this workflow builds and uploads an artifact, and release.yml
    # is what publishes. Nothing here needs write access any more.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target host
        id: cfg
        run: |
          HOST="${{ inputs.host || vars.TWA_HOST }}"
          if [ -z "$HOST" ]; then
            # A TWA is bound to a domain, so with no host configured there is
            # nothing meaningful to build. Skip rather than fail: the wrapper
            # is optional, and a red X on every PR of a fresh clone would be a
            # false alarm about a feature the owner has not set up.
            echo "::notice::TWA_HOST is not set; skipping the TWA build. See .github/workflows/README.md"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          # A scheme or trailing slash here silently produces a broken manifest.
          case "$HOST" in
            *://*) echo "::error::TWA_HOST must not include a scheme: $HOST"; exit 1 ;;
            */*)   echo "::error::TWA_HOST must not include a path: $HOST"; exit 1 ;;
          esac
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "Building a TWA for https://$HOST"

      - name: Verify the PWA manifest is reachable
        if: steps.cfg.outputs.skip != 'true'
        run: |
          # Fail here with a clear message rather than deep inside bubblewrap.
          URL="https://${{ steps.cfg.outputs.host }}/shared/manifest.json"
          if ! curl -fsSL --max-time 20 "$URL" -o /tmp/manifest.json; then
            echo "::error::Cannot fetch $URL — is the site public and served over HTTPS?"
            exit 1
          fi
          node -e "
            const m = require('/tmp/manifest.json');
            const missing = ['name','short_name','start_url','display','icons']
              .filter(k => !m[k]);
            if (missing.length) {
              console.error('::error::manifest is missing: ' + missing.join(', '));
              process.exit(1);
            }
            console.log('manifest ok:', m.name);
          "

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install bubblewrap
        if: steps.cfg.outputs.skip != 'true'
        run: npm install -g @bubblewrap/cli

      - name: Restore the signing keystore
        if: steps.cfg.outputs.skip != 'true'
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # A fork PR cannot read secrets, and a fresh clone has none set.
          # Generating a throwaway key lets the build still prove it compiles,
          # which is the whole point of running on a PR. The resulting APK is
          # never published — see the release gate below.
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::notice::No signing keystore configured; using a throwaway key for validation only."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/android.keystore"               -alias habiterall -keyalg RSA -keysize 2048 -validity 1               -storepass throwaway -keypass throwaway               -dname "CN=habiterall-ci, O=validation, C=US" >/dev/null 2>&1
            echo "real=false" >> "$GITHUB_OUTPUT"
            echo "alias=habiterall" >> "$GITHUB_OUTPUT"
            echo "pass=throwaway" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android.keystore"
            echo "real=true" >> "$GITHUB_OUTPUT"
            echo "alias=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_OUTPUT"
            echo "pass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "keystore restored ($(stat -c%s "$RUNNER_TEMP/android.keystore") bytes)"
          fi

      - name: Generate the TWA project
        if: steps.cfg.outputs.skip != 'true'
        working-directory: android
        env:
          HOST: ${{ steps.cfg.outputs.host }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Point the checked-in manifest at the real host, then let bubblewrap
          # scaffold from it non-interactively.
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            const host = process.env.HOST;
            m.host = host;
            m.webManifestUrl   = 'https://' + host + '/shared/manifest.json';
            m.fullScopeUrl     = 'https://' + host + '/';
            m.iconUrl          = 'https://' + host + '/shared/icons/icon-512.png';
            m.maskableIconUrl  = 'https://' + host + '/shared/icons/icon-maskable-512.png';
            m.signingKey = { path: process.env.RUNNER_TEMP + '/android.keystore',
                             alias: process.env.KEY_ALIAS || m.signingKey.alias };
            // The version release.yml is cutting, or the tag if this ran on its
            // own. Both APKs in a release must carry the same one, or the two
            // Android builds of one release claim to be different versions.
            const tag = (process.env.RELEASE_VERSION
                      || process.env.GITHUB_REF_NAME || '').replace(/^(android-)?v/, '');
            if (/^\d+\.\d+\.\d+$/.test(tag)) {
              m.appVersionName = tag;
              const [maj, min, pat] = tag.split('.').map(Number);
              m.appVersionCode = maj * 10000 + min * 100 + pat;
            }
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
            console.log('host=' + m.host, 'version=' + m.appVersionName,
                        'code=' + m.appVersionCode);
          "

      - name: Build and sign the APK
        if: steps.cfg.outputs.skip != 'true'
        working-directory: android
        env:
          KEY_ALIAS: ${{ steps.keystore.outputs.alias }}
          KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.pass }}
          KEY_PASSWORD: ${{ steps.keystore.outputs.pass }}
        run: |
          bubblewrap build --skipPwaValidation \
            --signingKeyPath "$RUNNER_TEMP/android.keystore" \
            --signingKeyAlias "$KEY_ALIAS" <<EOF
          $KEYSTORE_PASSWORD
          $KEY_PASSWORD
          EOF
          ls -la app-release-signed.apk

      - name: Report the signing fingerprint
        if: steps.cfg.outputs.skip != 'true'
        working-directory: android
        run: |
          # This is what must appear in assetlinks.json, or the app shows a
          # URL bar. Printing it here saves a round trip.
          echo "### Signing fingerprint" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          keytool -printcert -jarfile app-release-signed.apk \
            | grep -i "SHA256:" | head -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Put this in /.well-known/assetlinks.json on https://${{ steps.cfg.outputs.host }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Name the APK after the version
        if: steps.cfg.outputs.skip != 'true'
        working-directory: android
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          V="${RELEASE_VERSION:-dev}"
          cp app-release-signed.apk "habiterall-twa-$V.apk"

      - uses: actions/upload-artifact@v4
        if: steps.cfg.outputs.skip != 'true'
        with:
          name: apk-twa
          path: android/habiterall-twa-*.apk

      # Nothing is attached to a release from here. release.yml collects this
      # artifact and publishes it with everything else, so one release carries
      # one set of assets rather than a trickle of per-workflow tags.
