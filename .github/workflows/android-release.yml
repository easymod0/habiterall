# Builds a signed Android APK (a Trusted Web Activity wrapping the PWA) and
# attaches it to a GitHub Release.
#
# Triggered by pushing a tag like `android-v1.0.0`, or manually from the
# Actions tab. Nothing needs installing locally — the JDK and Android SDK live
# on the runner.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#
#   ANDROID_KEYSTORE_BASE64  the signing keystore, base64-encoded:
#                              base64 -w0 android.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Required repository variable:
#
#   TWA_HOST                 e.g. habits.example.com  (no scheme, no path)
#
# Generate a keystore once, and keep it safe — losing it means you cannot ship
# an update that installs over an existing copy:
#
#   keytool -genkeypair -v -keystore android.keystore \
#     -alias habiterall -keyalg RSA -keysize 2048 -validity 10000

name: Android APK

on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      host:
        description: 'Host to wrap (overrides the TWA_HOST variable)'
        required: false
        type: string

permissions:
  contents: write        # needed to create the release and upload the APK

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target host
        id: cfg
        run: |
          HOST="${{ inputs.host || vars.TWA_HOST }}"
          if [ -z "$HOST" ]; then
            echo "::error::Set the TWA_HOST repository variable (e.g. habits.example.com)"
            exit 1
          fi
          # A scheme or trailing slash here silently produces a broken manifest.
          case "$HOST" in
            *://*) echo "::error::TWA_HOST must not include a scheme: $HOST"; exit 1 ;;
            */*)   echo "::error::TWA_HOST must not include a path: $HOST"; exit 1 ;;
          esac
          echo "host=$HOST" >> "$GITHUB_OUTPUT"
          echo "Building a TWA for https://$HOST"

      - name: Verify the PWA manifest is reachable
        run: |
          # Fail here with a clear message rather than deep inside bubblewrap.
          URL="https://${{ steps.cfg.outputs.host }}/shared/manifest.json"
          if ! curl -fsSL --max-time 20 "$URL" -o /tmp/manifest.json; then
            echo "::error::Cannot fetch $URL — is the site public and served over HTTPS?"
            exit 1
          fi
          node -e "
            const m = require('/tmp/manifest.json');
            const missing = ['name','short_name','start_url','display','icons']
              .filter(k => !m[k]);
            if (missing.length) {
              console.error('::error::manifest is missing: ' + missing.join(', '));
              process.exit(1);
            }
            console.log('manifest ok:', m.name);
          "

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Restore the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android.keystore"
          echo "keystore restored ($(stat -c%s "$RUNNER_TEMP/android.keystore") bytes)"

      - name: Generate the TWA project
        working-directory: android
        env:
          HOST: ${{ steps.cfg.outputs.host }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Point the checked-in manifest at the real host, then let bubblewrap
          # scaffold from it non-interactively.
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            const host = process.env.HOST;
            m.host = host;
            m.webManifestUrl   = 'https://' + host + '/shared/manifest.json';
            m.fullScopeUrl     = 'https://' + host + '/';
            m.iconUrl          = 'https://' + host + '/shared/icons/icon-512.png';
            m.maskableIconUrl  = 'https://' + host + '/shared/icons/icon-maskable-512.png';
            m.signingKey = { path: process.env.RUNNER_TEMP + '/android.keystore',
                             alias: process.env.KEY_ALIAS || m.signingKey.alias };
            // Derive a version from the tag so each release installs over the last.
            const tag = (process.env.GITHUB_REF_NAME || '').replace(/^android-v/, '');
            if (/^\d+\.\d+\.\d+$/.test(tag)) {
              m.appVersionName = tag;
              const [maj, min, pat] = tag.split('.').map(Number);
              m.appVersionCode = maj * 10000 + min * 100 + pat;
            }
            fs.writeFileSync('twa-manifest.json', JSON.stringify(m, null, 2));
            console.log('host=' + m.host, 'version=' + m.appVersionName,
                        'code=' + m.appVersionCode);
          "

      - name: Build and sign the APK
        working-directory: android
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap build --skipPwaValidation \
            --signingKeyPath "$RUNNER_TEMP/android.keystore" \
            --signingKeyAlias "$KEY_ALIAS" <<EOF
          $KEYSTORE_PASSWORD
          $KEY_PASSWORD
          EOF
          ls -la app-release-signed.apk

      - name: Report the signing fingerprint
        working-directory: android
        run: |
          # This is what must appear in assetlinks.json, or the app shows a
          # URL bar. Printing it here saves a round trip.
          echo "### Signing fingerprint" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          keytool -printcert -jarfile app-release-signed.apk \
            | grep -i "SHA256:" | head -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Put this in /.well-known/assetlinks.json on https://${{ steps.cfg.outputs.host }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: habiterall-apk
          path: android/app-release-signed.apk

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app-release-signed.apk
          generate_release_notes: true
