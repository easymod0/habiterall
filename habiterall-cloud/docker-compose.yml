# Full self-hosted stack: habiterall-cloud, its Postgres, and an Authentik
# identity provider (server + worker).
#
#   cp .env.example .env    # then fill in the secrets
#   docker compose up -d
#
# First run: see SETUP.md for creating the Authentik admin and the OIDC
# application. Nothing but the reverse proxy needs to be internet-facing.

services:
  # ---------------------------------------------------------------- database
  db:
    image: postgres:17-alpine
    container_name: habiterall-db
    environment:
      POSTGRES_DB: habiterall
      POSTGRES_USER: habiterall_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env}
      # Consumed by the init script that provisions Authentik's own database.
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD:?set AUTHENTIK_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Authentik keeps its own database in the same server, created on boot.
      - ./scripts/init-authentik-db.sh:/docker-entrypoint-initdb.d/10-authentik.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U habiterall_owner -d habiterall']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ------------------------------------------------------------- authentik
  # Postgres is the only dependency: 2025.10 removed Redis from Authentik
  # outright, having moved caching, the embedded outpost and its WebSockets
  # into Postgres (tasks went there in 2025.8). Pinned to an exact patch, not
  # the `2026.5` family tag, so what starts here is what Dependabot last
  # proposed — and note upgrades may not skip a major family, so the step to
  # 2026.8 is a step, not a jump.
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.5.6
    container_name: authentik-server
    command: server
    depends_on:
      db: { condition: service_healthy }
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?set AUTHENTIK_DB_PASSWORD}
      # Only needed to bootstrap the first admin; harmless to leave set.
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@example.com}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      # Authentik's own names, so what is in .env is what its documentation
      # calls the setting. Only self-service registration with email
      # verification needs these; nothing else here sends mail.
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST:-localhost}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT:-25}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD:-}
      AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL__USE_TLS:-false}
      AUTHENTIK_EMAIL__USE_SSL: ${AUTHENTIK_EMAIL__USE_SSL:-false}
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__FROM:-authentik@localhost}
    # `/data`, not `/media`: 2025.12 reworked file storage and serves uploads
    # from `/files`, with the local backend expecting one mount at `/data`. A
    # `/media` mount is not an error — it is simply somewhere nothing writes,
    # so branding and icons go into the container's writable layer instead and
    # leave on the next `up`.
    volumes:
      - authentik-data:/data
      - authentik-templates:/templates
      # Read-only, and read by both containers: the server serves the file
      # list this path is validated against, the worker is what produces it.
      - ./blueprints:/blueprints/custom:ro
      # The sign-in page's logo and backdrop, as Authentik's own static
      # assets — /web/dist/assets is what it serves at /static/dist/assets,
      # and a `/static/...` path is one of the two values its brand fields
      # take without an upload. The app could serve these instead, and its
      # `Cross-Origin-Resource-Policy: same-origin` is why it does not.
      #
      # DIRECTORIES, into subdirectories of Authentik's own. Mounting the two
      # files individually works until one is edited: a bind-mounted file
      # follows the inode, and an editor that saves atomically leaves the
      # container serving the version from when it started. Mounting the
      # parent directories over Authentik's would instead hide its own images.
      - ../shared/public/icons:/web/dist/assets/icons/habiterall:ro
      - ./branding:/web/dist/assets/images/habiterall:ro
    ports:
      - '${AUTHENTIK_PORT:-9000}:9000'
    restart: unless-stopped

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5.6
    container_name: authentik-worker
    command: worker
    depends_on:
      db: { condition: service_healthy }
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@example.com}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST:-localhost}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT:-25}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD:-}
      AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL__USE_TLS:-false}
      AUTHENTIK_EMAIL__USE_SSL: ${AUTHENTIK_EMAIL__USE_SSL:-false}
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__FROM:-authentik@localhost}
    volumes:
      - authentik-data:/data
      - authentik-templates:/templates
      - authentik-certs:/certs
      - ./blueprints:/blueprints/custom:ro
      - ../shared/public/icons:/web/dist/assets/icons/habiterall:ro
      - ./branding:/web/dist/assets/images/habiterall:ro
    restart: unless-stopped

  # The OIDC application, and the self-service registration switch. One-shot
  # and idempotent, so it runs on every `up` and there is no first-run
  # checklist: with OIDC_CLIENT_ID / OIDC_CLIENT_SECRET set in .env, both the
  # provider and the app are configured from the same two lines and nothing
  # is pasted between them.
  #
  # Without AUTHENTIK_BOOTSTRAP_TOKEN it exits 0 having done nothing, which is
  # what keeps `up` working after the production checklist has you delete it.
  authentik-bootstrap:
    build:
      context: ..
      dockerfile: habiterall-cloud/Dockerfile
    container_name: habiterall-authentik-bootstrap
    depends_on:
      authentik-server: { condition: service_started }
      authentik-worker: { condition: service_started }
    environment:
      # The API is reached over the compose network; the ISSUER has to be the
      # string a browser sees, and they are not the same host.
      AUTHENTIK_URL: http://authentik-server:9000
      AUTHENTIK_PUBLIC_URL: ${AUTHENTIK_PUBLIC_URL:-http://localhost:${AUTHENTIK_PORT:-9000}}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # Whether strangers may create their own accounts, and whether they must
      # confirm an email address first. Parsed strictly — an unrecognised
      # value fails this container rather than being read as "on".
      AUTHENTIK_SELF_SIGNUP: ${AUTHENTIK_SELF_SIGNUP:-off}
      AUTHENTIK_SELF_SIGNUP_VERIFY_EMAIL: ${AUTHENTIK_SELF_SIGNUP_VERIFY_EMAIL:-off}
      # The sign-in and sign-up pages in habiterall's name. On by default.
      AUTHENTIK_BRANDING: ${AUTHENTIK_BRANDING:-on}
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST:-}
    command: ['node', 'scripts/bootstrap-authentik.mjs']
    restart: 'no'

  # ------------------------------------------------------------ application
  migrate:
    build:
      context: ..
      dockerfile: habiterall-cloud/Dockerfile
    container_name: habiterall-migrate
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL_ADMIN: postgres://habiterall_owner:${DB_OWNER_PASSWORD}@db:5432/habiterall
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    command: ['node', 'src/db/migrate.js']
    restart: 'no'

  app:
    build:
      context: ..
      dockerfile: habiterall-cloud/Dockerfile
    container_name: habiterall-cloud
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      authentik-bootstrap: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      PORT: 3000
      # The app connects as the restricted, RLS-bound role — never the owner.
      DATABASE_URL: postgres://habiterall_app:${APP_DB_PASSWORD}@db:5432/habiterall
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      OIDC_ISSUER: ${OIDC_ISSUER:?set OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Server-sent reminders (a Discord webhook). Costs nothing until a user
      # configures one; on-device reminders never involve this process.
      HABITERALL_NOTIFY: ${HABITERALL_NOTIFY:-on}
      HABITERALL_NOTIFY_INTERVAL_MS: ${HABITERALL_NOTIFY_INTERVAL_MS:-60000}
      NOTIFY_MAX_ACCOUNTS: ${NOTIFY_MAX_ACCOUNTS:-500}
      # Set to enable Discord buttons. Opens one outbound WebSocket; needs no
      # inbound port.
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      # Local HTTP testing only; never set this in a real deployment.
      ALLOW_INSECURE_OIDC: ${ALLOW_INSECURE_OIDC:-false}
    ports:
      - '${APP_PORT:-3100}:3000'
    # The OIDC issuer string must be byte-identical for the browser and for
    # this container, or token validation fails on an issuer mismatch. In a
    # real deployment both use the public https URL; for a local stack we
    # alias the browser-facing host to the Authentik container.
    extra_hosts:
      - '${OIDC_HOST_ALIAS:-localhost}:host-gateway'
    restart: unless-stopped

volumes:
  db-data:
  authentik-data:
  authentik-templates:
  authentik-certs:
