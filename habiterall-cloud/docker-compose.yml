# Full self-hosted stack built from this checkout: habiterall-cloud, its
# Postgres, and an Authentik identity provider (server + worker).
#
#   cp ../examples/cloud.env.example .env    # then fill in the secrets
#   docker compose up -d
#
# The app, the database and the migration step carry no environment block here.
# It is in ../examples/docker-compose.cloud.yml — the file the README prints
# and a reader downloads — and the three services below EXTEND those rather
# than copying them, so it exists once for this edition. The two were
# maintained by hand and had drifted in both directions: six variables here
# that the example never mentioned, and a `TZ` there that this file did not set.
#
# What is added below is exactly what a checkout is for and a published file
# cannot have: `build:` in place of `image:`, and the identity provider. Note
# the topology differs from examples/docker-compose.cloud-authentik.yml on
# purpose — Authentik's database lives in the same Postgres server here,
# created by an init script this checkout has and a downloader does not.
#
# `extends:`, not `include:`. They look interchangeable and are not: include
# loads another file's services alongside this one's and "displays a warning if
# resource names conflict and doesn't try to merge them", so declaring `app` in
# both would leave a container with a build and no environment at all — which
# starts, and looks fine. `extends` is the merging one: a scalar here wins, a
# mapping is merged key by key, and a sequence is concatenated.
#
# One thing is restated below rather than inherited: the top-level `volumes:`
# declarations, because `extends` works at the service level and genuinely does
# not carry them.
#
# `depends_on` IS carried — measured with `docker compose config`, not assumed;
# Compose v1 did not share it and the current documentation says neither way.
# It is a mapping, so it merges key by key and a key CANNOT be removed. That is
# what stops the `authentik-*` services below extending the ones in
# examples/docker-compose.cloud-authentik.yml: they depend on an `authentik-db`
# this stack does not run, and the inherited key makes the project invalid.
# They stay a hand-kept copy, and `shared/test/compose.test.js` lists both
# files so a new variable has to reach both.
#
# Needs Compose v2.20 or newer (2023).
#
# First run: see SETUP.md. Nothing but the reverse proxy needs to be
# internet-facing.

services:
  # ---------------------------------------------------------------- database
  # One Postgres server for both databases, which is what the init script
  # below is for. The published Authentik example runs a second server
  # instead: it has no checkout to mount a script from.
  db:
    extends:
      file: ../examples/docker-compose.cloud.yml
      service: db
    container_name: habiterall-db
    environment:
      # Consumed by the init script that provisions Authentik's own database.
      AUTHENTIK_DB_PASSWORD: ${AUTHENTIK_DB_PASSWORD:?set AUTHENTIK_DB_PASSWORD}
    volumes:
      - ./scripts/init-authentik-db.sh:/docker-entrypoint-initdb.d/10-authentik.sh:ro

  # ------------------------------------------------------------- authentik
  # Postgres is the only dependency: 2025.10 removed Redis from Authentik
  # outright, having moved caching, the embedded outpost and its WebSockets
  # into Postgres (tasks went there in 2025.8). Pinned to an exact patch, not
  # the `2026.5` family tag, so what starts here is what Dependabot last
  # proposed — and note upgrades may not skip a major family, so the step to
  # 2026.8 is a step, not a jump.
  authentik-server:
    image: ghcr.io/goauthentik/server:2026.5.6
    container_name: authentik-server
    command: server
    depends_on:
      db: { condition: service_healthy }
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?set AUTHENTIK_DB_PASSWORD}
      # Only needed to bootstrap the first admin; harmless to leave set.
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@example.com}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      # Authentik's own names, so what is in .env is what its documentation
      # calls the setting. Only self-service registration with email
      # verification needs these; nothing else here sends mail.
      #
      # Submission port and STARTTLS by default, as .env.example and the
      # published example both have it. These fall back for an .env written
      # before those lines existed, and the minimal edit to such a file is to
      # fill in the host and the credentials — which on port 25 with TLS off
      # puts an SMTP password and an account-activation link on the wire in
      # the clear. Lower it only for a relay on the same host.
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST:-localhost}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT:-587}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD:-}
      AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL__USE_TLS:-true}
      AUTHENTIK_EMAIL__USE_SSL: ${AUTHENTIK_EMAIL__USE_SSL:-false}
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__FROM:-authentik@localhost}
    # `/data`, not `/media`: 2025.12 reworked file storage and serves uploads
    # from `/files`, with the local backend expecting one mount at `/data`. A
    # `/media` mount is not an error — it is simply somewhere nothing writes,
    # so branding and icons go into the container's writable layer instead and
    # leave on the next `up`.
    volumes:
      - authentik-data:/data
      - authentik-templates:/templates
      # Read-only, and read by both containers: the server serves the file
      # list this path is validated against, the worker is what produces it.
      - ./blueprints:/blueprints/custom:ro
      # The sign-in page's logo and backdrop, as Authentik's own static
      # assets — /web/dist/assets is what it serves at /static/dist/assets,
      # and a `/static/...` path is one of the two values its brand fields
      # take without an upload. The app could serve these instead, and its
      # `Cross-Origin-Resource-Policy: same-origin` is why it does not.
      #
      # DIRECTORIES, into subdirectories of Authentik's own. Mounting the two
      # files individually works until one is edited: a bind-mounted file
      # follows the inode, and an editor that saves atomically leaves the
      # container serving the version from when it started. Mounting the
      # parent directories over Authentik's would instead hide its own images.
      - ../shared/public/icons:/web/dist/assets/icons/habiterall:ro
      - ./branding:/web/dist/assets/images/habiterall:ro
    ports:
      - '${BIND_ADDR:-}:${AUTHENTIK_PORT:-9000}:9000'
    restart: unless-stopped

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.5.6
    container_name: authentik-worker
    command: worker
    depends_on:
      db: { condition: service_healthy }
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-admin@example.com}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      # Same defaults as the server above, and for the same reason: the worker
      # is what actually sends the mail.
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST:-localhost}
      AUTHENTIK_EMAIL__PORT: ${AUTHENTIK_EMAIL__PORT:-587}
      AUTHENTIK_EMAIL__USERNAME: ${AUTHENTIK_EMAIL__USERNAME:-}
      AUTHENTIK_EMAIL__PASSWORD: ${AUTHENTIK_EMAIL__PASSWORD:-}
      AUTHENTIK_EMAIL__USE_TLS: ${AUTHENTIK_EMAIL__USE_TLS:-true}
      AUTHENTIK_EMAIL__USE_SSL: ${AUTHENTIK_EMAIL__USE_SSL:-false}
      AUTHENTIK_EMAIL__FROM: ${AUTHENTIK_EMAIL__FROM:-authentik@localhost}
    volumes:
      - authentik-data:/data
      - authentik-templates:/templates
      - authentik-certs:/certs
      - ./blueprints:/blueprints/custom:ro
      - ../shared/public/icons:/web/dist/assets/icons/habiterall:ro
      - ./branding:/web/dist/assets/images/habiterall:ro
    restart: unless-stopped

  # The OIDC application, and the self-service registration switch. One-shot
  # and idempotent, so it runs on every `up` and there is no first-run
  # checklist: with OIDC_CLIENT_ID / OIDC_CLIENT_SECRET set in .env, both the
  # provider and the app are configured from the same two lines and nothing
  # is pasted between them.
  #
  # Without AUTHENTIK_BOOTSTRAP_TOKEN it exits 0 having done nothing, which is
  # what keeps `up` working after the production checklist has you delete it.
  #
  # It reads the blueprints and the branding straight from the checkout, which
  # the bind mounts above put in front of Authentik — so editing one takes
  # effect on the next request. The published example has no checkout and
  # copies them out of the image into volumes instead, which is what
  # AUTHENTIK_BLUEPRINTS_OUT and its two siblings are for there.
  authentik-bootstrap:
    build:
      context: ..
      dockerfile: habiterall-cloud/Dockerfile
    image: habiterall-cloud:latest
    container_name: habiterall-authentik-bootstrap
    depends_on:
      authentik-server: { condition: service_started }
      authentik-worker: { condition: service_started }
    environment:
      # The API is reached over the compose network; the ISSUER has to be the
      # string a browser sees, and they are not the same host.
      AUTHENTIK_URL: http://authentik-server:9000
      AUTHENTIK_PUBLIC_URL: ${AUTHENTIK_PUBLIC_URL:-http://localhost:${AUTHENTIK_PORT:-9000}}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN:-}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      # Whether strangers may create their own accounts, and whether they must
      # confirm an email address first. Parsed strictly — an unrecognised
      # value fails this container rather than being read as "on".
      AUTHENTIK_SELF_SIGNUP: ${AUTHENTIK_SELF_SIGNUP:-off}
      AUTHENTIK_SELF_SIGNUP_VERIFY_EMAIL: ${AUTHENTIK_SELF_SIGNUP_VERIFY_EMAIL:-off}
      # The sign-in and sign-up pages in habiterall's name. On by default.
      AUTHENTIK_BRANDING: ${AUTHENTIK_BRANDING:-on}
      AUTHENTIK_EMAIL__HOST: ${AUTHENTIK_EMAIL__HOST:-}
    command: ['node', 'scripts/bootstrap-authentik.mjs']
    restart: 'no'

  # ------------------------------------------------------------ application
  # Both of these are the published file's services with the image built rather
  # than pulled. One `image:` tag for all three build sites, so Compose builds
  # it once — and a local name, so `--build` does not take over the one a
  # `docker pull` of the published image would land under.
  migrate:
    extends:
      file: ../examples/docker-compose.cloud.yml
      service: migrate
    build:
      context: ..
      dockerfile: habiterall-cloud/Dockerfile
    image: habiterall-cloud:latest
    container_name: habiterall-migrate
    # `depends_on: db` comes across from the extended file — see the header.

  app:
    extends:
      file: ../examples/docker-compose.cloud.yml
      service: app
    build:
      context: ..
      dockerfile: habiterall-cloud/Dockerfile
    image: habiterall-cloud:latest
    container_name: habiterall-cloud
    # `db` and `migrate` come across from the extended file; this adds the
    # third, because the identity provider the app signs people in against is
    # configured by a container here. A mapping merges key by key, so the
    # inherited two survive.
    depends_on:
      authentik-bootstrap: { condition: service_completed_successfully }
    # The OIDC issuer string must be byte-identical for the browser and for
    # this container, or token validation fails on an issuer mismatch. In a
    # real deployment both use the public https URL; for a local stack we
    # alias the browser-facing host to the Authentik container.
    extra_hosts:
      - '${OIDC_HOST_ALIAS:-localhost}:host-gateway'

# Named again here: `extends` works at the service level, so a top-level
# declaration in the file being extended is not carried across. `db-data` is
# the published file's; the three below belong to the identity provider, which
# only this stack runs.
volumes:
  db-data:
  authentik-data:
  authentik-templates:
  authentik-certs:
