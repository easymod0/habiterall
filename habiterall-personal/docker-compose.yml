# Single-user edition, built from this checkout. Run from this directory:
#   docker compose up -d --build
#
# There is no environment block here, and that is the point. Everything except
# the build is in ../examples/docker-compose.personal.yml — the file the README
# prints and a reader downloads — and this EXTENDS it rather than copying it.
# The two were maintained by hand: #54 added ten variables to this file, none
# of them reached the example, and every test stayed green.
#
# `extends:`, not `include:`. They look interchangeable and are not: include
# loads another file's services alongside this one's and "displays a warning if
# resource names conflict and doesn't try to merge them", so declaring
# `habiterall` in both would leave a container with a build and no environment
# at all — which starts, and looks fine. `extends` is the merging one, and the
# rules are the ones this file needs: a scalar here wins, a mapping is merged
# key by key, and a sequence is concatenated.
#
# What `extends` does NOT carry is the top-level `volumes:` declaration — it
# works at the service level only — so `habiterall-data` is named again below.
# The service-level `volumes:`, the ports and the whole environment do come
# across; the cloud file has the longer note on what has to be restated there.
#
# To set anything, `cp ../examples/personal.env.example .env` here — that is
# the template for every variable the extended file interpolates, and a
# variable it does not name reaches no container. To change the file's own
# shape instead, put it in a `docker-compose.override.yml`; Compose loads one
# automatically.
#
# Needs Compose v2.20 or newer.

services:
  habiterall:
    extends:
      file: ../examples/docker-compose.personal.yml
      service: habiterall
    # The only difference from the published file. The context is the repo root
    # because the app depends on the `shared` workspace, which lives outside
    # this folder; the local tag is so `--build` does not take over the name a
    # `docker pull` of the published image would land under.
    build:
      context: ..
      dockerfile: habiterall-personal/Dockerfile
    image: habiterall:latest

volumes:
  habiterall-data:
