# habiterall, cloud edition — multi user, Postgres, your own OIDC provider.
#
# This file is the ONE place the cloud edition's environment is described. The
# copy in README.md is generated from it (`npm run docs:compose`), and
# `habiterall-cloud/docker-compose.yml` EXTENDS it and adds only what a
# checkout needs: `build:`, and the Authentik services. So a variable added
# here reaches both. `shared/test/compose.test.js` fails if the server reads
# one that is not below — including the copy in docker-compose.cloud-authentik.yml,
# which has to stay standalone and therefore repeats it.
#
# Needs a .env beside it:
#
#   DB_OWNER_PASSWORD=...      openssl rand -base64 36
#   APP_DB_PASSWORD=...        openssl rand -base64 36
#   SESSION_SECRET=...         openssl rand -base64 36
#   PUBLIC_URL=https://habits.example.com
#   OIDC_ISSUER=...            from your provider; must end in a slash
#   OIDC_CLIENT_ID=...
#   OIDC_CLIENT_SECRET=...
#
# Register ${PUBLIC_URL}/auth/callback as the redirect URI with your provider.
#
# Pin the image tag here rather than tracking `latest`: this edition runs
# migrations on deploy, so `latest` means taking a schema change at a moment you
# did not choose.
#
#   docker compose -f docker-compose.cloud.yml up -d

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: habiterall
      POSTGRES_USER: habiterall_owner
      POSTGRES_PASSWORD: ${DB_OWNER_PASSWORD:?set it in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U habiterall_owner -d habiterall']
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Runs once per deploy, as a SEPARATE credential the app never holds — it is
  # the only thing allowed to change the schema. `up -d` waits for it to finish.
  migrate:
    image: ghcr.io/easymod0/habiterall-cloud:latest
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL_ADMIN: postgres://habiterall_owner:${DB_OWNER_PASSWORD}@db:5432/habiterall
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set it in .env}
    command: ['node', 'src/db/migrate.js']
    restart: 'no'

  app:
    image: ghcr.io/easymod0/habiterall-cloud:latest
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    ports:
      - '${APP_PORT:-3100}:3000'
    environment:
      NODE_ENV: production
      # The RESTRICTED role — not the owner. This is what makes a forgotten
      # WHERE clause return nothing instead of another user's rows.
      DATABASE_URL: postgres://habiterall_app:${APP_DB_PASSWORD}@db:5432/habiterall
      SESSION_SECRET: ${SESSION_SECRET:?openssl rand -base64 36}
      PUBLIC_URL: ${PUBLIC_URL:?the address browsers use, https in production}
      OIDC_ISSUER: ${OIDC_ISSUER:?from your provider}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      # Local HTTP testing only, and never in a real deployment: it lets the
      # app accept a plaintext OIDC issuer, which puts tokens on the wire in
      # the clear. It logs a warning for as long as it is set.
      ALLOW_INSECURE_OIDC: ${ALLOW_INSECURE_OIDC:-false}
      # One TLS terminator in front, which is this edition's documented
      # deployment. Raise it if there are more, and set 0 only if browsers
      # reach this port directly — see "Put HTTPS in front" in the README, and
      # note that trusting a hop that is not there hands the rate limiter's
      # only key to the caller.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      # Reminders this process sends (a Discord channel). It costs nothing
      # until a user configures one: with none, the tick queries and stops.
      # On-device reminders never involve this process at all.
      HABITERALL_NOTIFY: ${HABITERALL_NOTIFY:-on}
      HABITERALL_NOTIFY_INTERVAL_MS: ${HABITERALL_NOTIFY_INTERVAL_MS:-60000}
      # Accounts visited per tick. A tick is a minute and each account may cost
      # a webhook round trip, so this bounds the work rather than letting one
      # pass overlap the next.
      NOTIFY_MAX_ACCOUNTS: ${NOTIFY_MAX_ACCOUNTS:-500}
      # The fallback clock: a container has no timezone, so it is UTC. Users can
      # override it for their own reminders in ⚙ → Notifications, but this is
      # what "the server's own timezone" means, and it is also the clock that
      # decides which day a check-off with no explicit date belongs to.
      TZ: ${TZ:-Etc/UTC}
    restart: unless-stopped

volumes:
  db-data:
